{% set name = "wagtail-sharing" %}
{% set version = "2.17" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e6135477ae6d6ff988e42ac193ed502a21951ec3c325e3cbdd3e7da3a84d14e4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=43.0.0
    - wheel
    - pip
  run:
    - django
    - python >={{ python_min }}
    - wagtail >=7.0

test:
  imports:
    - wagtailsharing
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Easier sharing of Wagtail drafts
  home: https://github.com/cfpb/wagtail-sharing
  license: CC0-1.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
